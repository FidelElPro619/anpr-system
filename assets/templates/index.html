<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificador de Placas</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Open Sans', 'Noto Sans JP', sans-serif; background-color: #f8f9fe; color: #525f7f; }
        .argon-header {
            background: linear-gradient(87deg, #5e72e4 0, #825ee4 100%) !important;
            padding-bottom: 5rem; padding-top: 2rem;
        }
        .card-argon {
            border: 0; border-radius: 1rem;
            box-shadow: 0 0 2rem 0 rgba(136, 152, 170, .15); background: #fff;
        }
        .main-content { margin-top: -4rem; }
        .video-wrapper {
            position: relative; display: inline-block;
            border-radius: 0.75rem; overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border: 4px solid #fff; background: #000;
            width: 640px; height: 480px; max-width: 100%;
        }
        #webcam { width: 100%; height: 100%; object-fit: fill; }
        #overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; pointer-events: none;
        }
        .hud-lectura {
            background: #172b4d; color: #2dce89;
            font-family: monospace, 'Noto Sans JP'; font-size: 1.15rem; font-weight: bold;
            padding: 8px 16px; border-radius: 8px; display: inline-block;
        }
        .lang-switcher {
            background: rgba(255, 255, 255, 0.2);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 0.5rem; padding: 6px 12px; font-weight: 700; cursor: pointer;
        }
        .lang-switcher option { color: #000; background: #fff; }
    </style>
</head>
<body>

    <div class="argon-header">
        <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h2 class="text-white fw-bold mb-0">
                <i class="fa-solid fa-car-rear me-2"></i><span data-i18n="nav_title">Identificador de Placas</span>
            </h2>
            <div class="d-flex align-items-center gap-2">
                <select id="lang-select" class="lang-switcher" onchange="cambiarIdioma(this.value)">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇺🇸 English</option>
                    <option value="ja">🇯🇵 日本語</option>
                </select>
                <a href="/admin" class="btn btn-light fw-bold shadow-sm">
                    <i class="fa-solid fa-gears me-1 text-primary"></i> <span data-i18n="btn_admin">Panel Administrador</span>
                </a>
            </div>
        </div>
    </div>

    <div class="container main-content pb-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card card-argon p-4 text-center">
                    <div class="d-flex justify-content-between align-items-center mb-3 px-2 flex-wrap gap-2">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-primary px-2 py-2"><i class="fa-solid fa-earth-americas"></i></span>
                            <select id="filtro-pais" class="form-select form-select-sm fw-bold">
                                <option value="ALL" data-i18n="filter_all">🌎 Todos (CO / JP / US)</option>
                                <option value="CO" data-i18n="filter_co">🇨🇴 Colombia (ABC-123)</option>
                                <option value="JP" data-i18n="filter_jp">🇯🇵 Japón (12-34)</option>
                                <option value="US" data-i18n="filter_us">🇺🇸 EE. UU. (7ABC123)</option>
                            </select>
                        </div>

                        <select id="camera-select" class="form-select form-select-sm w-auto fw-bold" onchange="cambiarCamara()" style="display:none;"></select>
                        
                        <span id="estado-motor" class="text-muted small fw-bold">
                            <i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> <span data-i18n="status_init">Iniciando cámara y radar...</span>
                        </span>
                    </div>

                    <div class="video-wrapper mx-auto">
                        <video id="webcam" autoplay playsinline muted></video>
                        <canvas id="overlay" width="640" height="480"></canvas>
                    </div>

                    <div class="mt-3">
                        <div class="hud-lectura" id="texto-en-vivo">
                            IDENTIFICANDO: [ ESPERANDO PLACA... ]
                        </div>
                    </div>

                    <canvas id="capture-canvas" width="420" height="160" style="display:none;"></canvas>

                    <div class="mt-3 d-flex justify-content-center gap-2 flex-wrap">
                        <button onclick="forzarEscaneoManual()" class="btn btn-primary fw-bold px-4" style="background:#5e72e4; border:none;">
                            <i class="fa-solid fa-crosshairs me-2"></i><span data-i18n="btn_verify">Verificar Ahora</span>
                        </button>
                        <button id="btn-pausa" onclick="toggleEscaneo()" class="btn btn-outline-secondary fw-bold px-3">
                            <i class="fa-solid fa-pause me-2"></i><span id="txt-pausa" data-i18n="btn_pause">Pausar Radar</span>
                        </button>
                        <button onclick="iniciarCamara()" class="btn btn-outline-info fw-bold px-3">
                            <i class="fa-solid fa-video me-1"></i><span data-i18n="btn_reconnect">Reconectar Cámara</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const banderas = { CO: '🇨🇴', JP: '🇯🇵', US: '🇺🇸' };

        const traducciones = {
            es: {

                btn_admin: "Panel Administrador",
                filter_all: "🌎 Todos (CO / JP / US)",
                filter_co: "🇨🇴 Colombia (ABC-123)",
                filter_jp: "🇯🇵 Japón (12-34)",
                filter_us: "🇺🇸 EE. UU. (7ABC123)",
                status_init: "Iniciando cámara y radar...",
                status_ready: "Radar IA Activo (Tiempo Real)",
                status_error: "Error cargando OCR",
                hud_waiting: "IDENTIFICANDO: [ ESPERANDO PLACA... ]",
                hud_detected: "PLACA DETECTADA",
                btn_verify: "Verificar Ahora",
                btn_pause: "Pausar Radar",
                btn_resume: "Reanudar Radar",
                btn_reconnect: "Reconectar Cámara",
                cam_label: "Cámara",
                cam_err_title: "Cámara no disponible",
                cam_err_msg: "Verifica que ninguna otra app esté usando la cámara y que hayas dado permiso.",
                btn_retry: "Reintentar",
                access_granted: "¡ACCESO ACEPTADO!",
                access_granted_msg: "Acceso autorizado a:",
                default_owner: "Vehículo Registrado",
                access_denied: "¡ACCESO DENEGADO!",
                access_denied_msg: "NO está registrada en el sistema.",
                warn_format_title: "Formato incompleto",
                warn_format_msg: "Acércala al recuadro central (Formatos válidos: CO ABC-123, JP 12-34, US 7ABC123).",
                country_CO: "Colombia",
                country_JP: "Japón",
                country_US: "Estados Unidos"
            },
            en: {
                page_title: "License Plate Identifier",
                nav_title: "License Plate Identifier",
                btn_admin: "Admin Panel",
                filter_all: "🌎 All (CO / JP / US)",
                filter_co: "🇨🇴 Colombia (ABC-123)",
                filter_jp: "🇯🇵 Japan (12-34)",
                filter_us: "🇺🇸 USA (7ABC123)",
                status_init: "Starting camera & radar...",
                status_ready: "AI Radar Active (Real-Time)",
                status_error: "Error loading OCR",
                hud_waiting: "IDENTIFYING: [ WAITING FOR PLATE... ]",
                hud_detected: "PLATE DETECTED",
                btn_verify: "Verify Now",
                btn_pause: "Pause Radar",
                btn_resume: "Resume Radar",
                btn_reconnect: "Reconnect Camera",
                cam_label: "Camera",
                cam_err_title: "Camera Unavailable",
                cam_err_msg: "Make sure no other app is using the camera and permissions are granted.",
                btn_retry: "Retry",
                access_granted: "ACCESS GRANTED!",
                access_granted_msg: "Authorized access for:",
                default_owner: "Registered Vehicle",
                access_denied: "ACCESS DENIED!",
                access_denied_msg: "is NOT registered in the system.",
                warn_format_title: "Incomplete Format",
                warn_format_msg: "Center the plate in the box (Valid formats: CO ABC-123, JP 12-34, US 7ABC123).",
                country_CO: "Colombia",
                country_JP: "Japan",
                country_US: "United States"
            },
            ja: {
                page_title: "ナンバープレート識別システム",
                nav_title: "ナンバープレート識別システム",
                btn_admin: "管理パネル",
                filter_all: "🌎 すべて (CO / JP / US)",
                filter_co: "🇨🇴 コロンビア (ABC-123)",
                filter_jp: "🇯🇵 日本 (12-34)",
                filter_us: "🇺🇸 アメリカ (7ABC123)",
                status_init: "カメラとレーダーを起動中...",
                status_ready: "AIレーダー稼働中 (リアルタイム)",
                status_error: "OCR読み込みエラー",
                hud_waiting: "認識中: [ ナンバープレート待機中... ]",
                hud_detected: "検出されたナンバー",
                btn_verify: "今すぐ確認",
                btn_pause: "一時停止",
                btn_resume: "レーダー再開",
                btn_reconnect: "カメラ再接続",
                cam_label: "カメラ",
                cam_err_title: "カメラが利用できません",
                cam_err_msg: "他のアプリがカメラを使用していないか、権限が許可されているか確認してください。",
                btn_retry: "再試行",
                access_granted: "アクセス承認！",
                access_granted_msg: "登録車両の入場を許可します：",
                default_owner: "登録済み車両",
                access_denied: "アクセス拒否！",
                access_denied_msg: "はシステムに登録されていません。",
                warn_format_title: "フォーマット未検出",
                warn_format_msg: "中央の枠にプレートを合わせてください (CO: ABC-123, JP: 12-34, US: 7ABC123)。",
                country_CO: "コロンビア",
                country_JP: "日本",
                country_US: "アメリカ"
            }
        };

        let idiomaActual = localStorage.getItem('argon_lang') || 'es';
        const t = (key) => traducciones[idiomaActual][key] || key;

        const video = document.getElementById('webcam');
        const overlay = document.getElementById('overlay');
        const ctxOverlay = overlay.getContext('2d');
        const capCanvas = document.getElementById('capture-canvas');
        const ctxCap = capCanvas.getContext('2d');
        const estadoMotor = document.getElementById('estado-motor');
        const hudTexto = document.getElementById('texto-en-vivo');
        const camSelect = document.getElementById('camera-select');
        const filtroPais = document.getElementById('filtro-pais');

        let worker = null;
        let motorListo = false;
        let escaneando = true;
        let alertaActiva = false;
        let ocupados = false;
        let ultimasPlacasValidas = [];
        let streamActual = null;

        function cambiarIdioma(lang) {
            idiomaActual = lang;
            localStorage.setItem('argon_lang', lang);
            document.documentElement.lang = lang;
            document.title = traducciones[lang].page_title;
            document.getElementById('lang-select').value = lang;

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (traducciones[lang][key]) el.innerText = traducciones[lang][key];
            });

            actualizarEstadoMotorUI();
            actualizarBotonPausaUI();
            if (ultimasPlacasValidas.length === 0) {
                hudTexto.innerText = t('hud_waiting');
            }
        }

        function actualizarEstadoMotorUI() {
            if (motorListo) {
                estadoMotor.innerHTML = `<i class="fa-solid fa-circle-check text-success me-1"></i> ${t('status_ready')}`;
            } else {
                estadoMotor.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-primary me-1"></i> ${t('status_init')}`;
            }
        }

        function actualizarBotonPausaUI() {
            const btn = document.getElementById('btn-pausa');
            btn.innerHTML = escaneando 
                ? `<i class="fa-solid fa-pause me-2"></i>${t('btn_pause')}` 
                : `<i class="fa-solid fa-play me-2"></i>${t('btn_resume')}`;
        }

        async function iniciarCamara(deviceId = null) {
            try {
                if (streamActual) {
                    streamActual.getTracks().forEach(track => track.stop());
                }

                const constraints = deviceId 
                    ? { video: { deviceId: { exact: deviceId } }, audio: false }
                    : { video: true, audio: false };

                streamActual = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = streamActual;
                await video.play();

                listarCamaras();

                if (!worker) {
                    iniciarMotorOCR();
                }
            } catch (err) {
                Swal.fire({
                    icon: 'error',
                    title: `${t('cam_err_title')} (${err.name})`,
                    text: t('cam_err_msg'),
                    confirmButtonText: t('btn_retry'),
                    confirmButtonColor: '#5e72e4'
                });
            }
        }

        async function listarCamaras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(d => d.kind === 'videoinput');
                if (videoDevices.length > 1) {
                    camSelect.style.display = 'inline-block';
                    const currentId = streamActual?.getVideoTracks()[0]?.getSettings()?.deviceId;
                    camSelect.innerHTML = videoDevices.map((d, idx) => 
                        `<option value="${d.deviceId}" ${d.deviceId === currentId ? 'selected' : ''}>${d.label || t('cam_label') + ' ' + (idx + 1)}</option>`
                    ).join('');
                }
            } catch (e) {
                console.error(e);
            }
        }

        function cambiarCamara() {
            iniciarCamara(camSelect.value);
        }

        async function iniciarMotorOCR() {
            try {
                worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
                    tessedit_pageseg_mode: '6'
                });
                motorListo = true;
                actualizarEstadoMotorUI();
                bucleDeteccion();
            } catch (e) {
                estadoMotor.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-danger me-1"></i> ${t('status_error')}`;
            }
        }

        function extraerFormatoPlaca(textoBruto) {
            const modo = filtroPais.value;
            const limpio = textoBruto.toUpperCase().replace(/[^A-Z0-9-]/g, '');
            const alfanum = limpio.replace(/-/g, '');

            if (modo === 'ALL' || modo === 'CO') {
                const matchCO = limpio.match(/(?<![A-Z])([A-Z]{3})-?([0-9]{3})(?![0-9])/);
                if (matchCO) {
                    return { placa: `${matchCO[1]}-${matchCO[2]}`, pais: 'CO' };
                }

                const numALetra = {'0':'O', '1':'I', '2':'Z', '5':'S', '8':'B'};
                const letraANum = {'O':'0', 'Q':'0', 'D':'0', 'I':'1', 'L':'1', 'Z':'2', 'S':'5', 'B':'8'};

                if (alfanum.length >= 6) {
                    for (let i = 0; i <= alfanum.length - 6; i++) {
                        const sub = alfanum.substring(i, i + 6);
                        const pLetras = sub.substring(0, 3);
                        const pNums = sub.substring(3, 6);
                        if ((pLetras.match(/[A-Z]/g) || []).length >= 2 && (pNums.match(/[0-9]/g) || []).length >= 2) {
                            const l = pLetras.split('').map(c => numALetra[c] || c).join('');
                            const n = pNums.split('').map(c => letraANum[c] || c).join('');
                            if (/^[A-Z]{3}$/.test(l) && /^[0-9]{3}$/.test(n)) {
                                return { placa: `${l}-${n}`, pais: 'CO' };
                            }
                        }
                    }
                }
            }

            if (modo === 'ALL' || modo === 'JP') {
                const matchJP = limpio.match(/(?<![0-9])([0-9]{2})-([0-9]{2})(?![0-9])/);
                if (matchJP) {
                    return { placa: `${matchJP[1]}-${matchJP[2]}`, pais: 'JP' };
                }
                if (modo === 'JP' && /^[0-9]{4}$/.test(alfanum)) {
                    return { placa: `${alfanum.substring(0,2)}-${alfanum.substring(2,4)}`, pais: 'JP' };
                }
            }

            if (modo === 'ALL' || modo === 'US') {
                const matchUS = alfanum.match(/([0-9][A-Z]{3}[0-9]{3})/);
                if (matchUS) {
                    return { placa: matchUS[1], pais: 'US' };
                }
                if (alfanum.length >= 6 && alfanum.length <= 7 && /[A-Z]/.test(alfanum) && /[0-9]/.test(alfanum)) {
                    return { placa: alfanum, pais: 'US' };
                }
            }

            return null;
        }

        function dibujarInterfaz(itemsDetectados, offsetX, offsetY) {
            ctxOverlay.clearRect(0, 0, overlay.width, overlay.height);

            ctxOverlay.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctxOverlay.lineWidth = 2;
            ctxOverlay.setLineDash([8, 6]);
            ctxOverlay.strokeRect(offsetX, offsetY, capCanvas.width, capCanvas.height);
            ctxOverlay.setLineDash([]);

            itemsDetectados.forEach(item => {
                const x = offsetX + item.bbox.x0;
                const y = offsetY + item.bbox.y0;
                const w = item.bbox.x1 - item.bbox.x0;
                const h = item.bbox.y1 - item.bbox.y0;

                const color = item.esValida ? '#2dce89' : '#fb6340';

                ctxOverlay.strokeStyle = color;
                ctxOverlay.lineWidth = 3;
                ctxOverlay.strokeRect(x - 4, y - 4, w + 8, h + 8);

                ctxOverlay.fillStyle = color;
                ctxOverlay.fillRect(x - 4, y - 28, Math.max(w + 8, 125), 24);
                ctxOverlay.fillStyle = '#000';
                ctxOverlay.font = 'bold 14px monospace';
                ctxOverlay.fillText(item.textoMostrar, x + 2, y - 11);
            });
        }

        async function bucleDeteccion() {
            if (escaneando && !alertaActiva && !ocupados && video.readyState >= 2) {
                ocupados = true;

                const offsetX = (overlay.width - capCanvas.width) / 2;
                const offsetY = (overlay.height - capCanvas.height) / 2;

                const vWidth = video.videoWidth || 640;
                const vHeight = video.videoHeight || 480;
                const scaleX = vWidth / overlay.width;
                const scaleY = vHeight / overlay.height;

                ctxCap.drawImage(
                    video,
                    offsetX * scaleX, offsetY * scaleY,
                    capCanvas.width * scaleX, capCanvas.height * scaleY,
                    0, 0, capCanvas.width, capCanvas.height
                );

                try {
                    const { data } = await worker.recognize(capCanvas);
                    const cajasDibujo = [];
                    const placasValidas = [];
                    const etiquetasHud = [];

                    if (data && data.lines) {
                        data.lines.forEach(line => {
                            const bruto = line.text.replace(/[^A-Z0-9-]/g, '').trim();
                            if (bruto.length >= 4) {
                                const resultado = extraerFormatoPlaca(bruto);
                                if (resultado) {
                                    const flag = banderas[resultado.pais] || '🌍';
                                    cajasDibujo.push({
                                        textoMostrar: `${ resultado.pais } ${ resultado.placa }`,
                                        bbox: line.bbox,
                                        esValida: true
                                    });
                                    placasValidas.push(resultado.placa);
                                    etiquetasHud.push(`${flag} ${resultado.placa}`);
                                } else {
                                    cajasDibujo.push({ textoMostrar: bruto, bbox: line.bbox, esValida: false });
                                }
                            }
                        });
                    }

                    ultimasPlacasValidas = placasValidas;
                    dibujarInterfaz(cajasDibujo, offsetX, offsetY);

                    if (placasValidas.length > 0) {
                        hudTexto.innerText = `${t('hud_detected')}: [ ${etiquetasHud.join(' | ')} ]`;
                        await consultarServidor(placasValidas);
                    } else {
                        hudTexto.innerText = t('hud_waiting');
                    }
                } catch (e) {
                    console.error(e);
                }
                ocupados = false;
            }
            requestAnimationFrame(() => setTimeout(bucleDeteccion, 180));
        }

        async function consultarServidor(listaPlacas) {
            if (alertaActiva) return;
            try {
                const res = await fetch('/api/verificar_rapido', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        textos: listaPlacas,
                        pais_filtro: filtroPais.value
                    })
                });
                const data = await res.json();

                if (data.detectada) {
                    alertaActiva = true;
                    const flag = banderas[data.pais] || '🌍';
                    const nombrePais = t('country_' + data.pais);

                    if (data.status === 'ACEPTADO') {
                        const prop = data.propietario && data.propietario !== 'Sin nombre' ? data.propietario : t('default_owner');
                        Swal.fire({
                            icon: 'success',
                            title: t('access_granted'),
                            html: `<h2 class="fw-bold text-success mb-1">${data.placa}</h2>
                                   <div class="badge bg-light text-dark border mb-3 fs-6">${flag} ${nombrePais}</div>
                                   <p class="mb-0">${t('access_granted_msg')} <strong>${prop}</strong></p>`,
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            allowOutsideClick: false
                        }).then(() => {
                            setTimeout(() => { alertaActiva = false; }, 1500);
                        });
                    } else {
                        Swal.fire({
                            icon: 'error',
                            title: t('access_denied'),
                            html: `<h2 class="fw-bold text-danger mb-1">${data.placa}</h2>
                                   <div class="badge bg-light text-dark border mb-3 fs-6">${flag} ${nombrePais}</div>
                                   <p class="mb-0"><strong>${data.placa}</strong> ${t('access_denied_msg')}</p>`,
                            showConfirmButton: false,
                            timer: 2000,
                            timerProgressBar: true,
                            allowOutsideClick: false
                        }).then(() => {
                            setTimeout(() => { alertaActiva = false; }, 1500);
                        });
                    }
                }
            } catch (err) {
                console.error(err);
            }
        }

        function forzarEscaneoManual() {
            if (ultimasPlacasValidas.length > 0) {
                consultarServidor(ultimasPlacasValidas);
            } else {
                Swal.fire({
                    icon: 'warning',
                    title: t('warn_format_title'),
                    text: t('warn_format_msg'),
                    showConfirmButton: false,
                    timer: 2000,
                    timerProgressBar: true
                });
            }
        }

            escaneando = !escaneando;
